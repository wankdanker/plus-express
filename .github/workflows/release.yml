name: Release

# Publishes to npm when a version tag is pushed (npm version <patch|minor|major>, then
# git push --follow-tags). Uses npm trusted publishing (OIDC), so no npm token is stored,
# and npm attaches provenance automatically. The trusted publisher on npmjs.com must name
# this file (release.yml) and the "npm" environment.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1 (Node 24 ships npm 11)
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Check the tag matches package.json and is on main
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi

      # Dependency install scripts aren't needed to build, so don't run them in the job that can publish
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Before publishing, so a missing changelog section stops the release before anything ships
      - name: Prepare release notes
        run: node scripts/changelog.mjs notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"

      # npm, not pnpm, publishes: trusted publishing needs npm >= 11.5.1.
      # prepublishOnly builds dist/. Prereleases (e.g. 3.0.0-beta.0) go to the "next" dist-tag
      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}"
